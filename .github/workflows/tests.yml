name: Tests

# Replaces the Jenkins openstudio-extension-gem job (Jenkinsfile).
on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      # Jenkins used nrel/openstudio:develop, which hasn't been rebuilt since 2026-02; 3.11.0 is the current release
      image: nrel/openstudio:3.11.0
    env:
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          locale-gen en_US.UTF-8
          gem install bundler -v '2.4.10'
          bundle _2.4.10_ install
          ruby -v
          openstudio openstudio_version

      - name: Run tests
        run: |
          bundle _2.4.10_ exec rake
          bundle _2.4.10_ exec rake openstudio:list_measures
          bundle _2.4.10_ exec rake openstudio:update_measures
          bundle _2.4.10_ exec rake openstudio:test_with_openstudio

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test
          if-no-files-found: ignore
          retention-days: 14
